<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Swift Charts Agent Skills</title>
  <desc id="desc">Selection-driven highlights in Swift Charts, built from masks and layered copies of the data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee7c7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ee7c7" stop-opacity="0.02"/>
    </linearGradient>
    <!-- The technique itself: one curve, drawn twice, each copy masked to its side of the selection -->
    <path id="curve" d="M40 196 C50.0 188.3 80.0 147.3 100 150 C120.0 152.7 140.0 219.7 160 212 C180.0 204.3 200.0 116.7 220 104 C240.0 91.3 260.0 124.0 280 136 C300.0 148.0 320.0 186.3 340 176 C360.0 165.7 390.0 91.0 400 74"/>
    <clipPath id="active"><rect x="0" y="0" width="280" height="286"/></clipPath>
    <clipPath id="dimmed"><rect x="280" y="0" width="440" height="286"/></clipPath>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>

  <!-- A chart panel: gridlines, the dimmed copy, the masked area and line, the selection rule and its popover -->
  <g transform="translate(780 97)">
    <rect x="0" y="0" width="440" height="286" rx="28" fill="url(#panel)" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="3"/>
    <g stroke="#e2e8f0" stroke-opacity="0.14" stroke-width="2">
      <path d="M40 252H400M40 190H400M40 128H400M40 66H400"/>
    </g>
    <use href="#curve" fill="none" stroke="#e2e8f0" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round" clip-path="url(#dimmed)"/>
    <path d="M40 196 C50.0 188.3 80.0 147.3 100 150 C120.0 152.7 140.0 219.7 160 212 C180.0 204.3 200.0 116.7 220 104 C240.0 91.3 260.0 124.0 280 136 C300.0 148.0 320.0 186.3 340 176 C360.0 165.7 390.0 91.0 400 74 L400 252 L40 252 Z" fill="url(#fill)" clip-path="url(#active)"/>
    <use href="#curve" fill="none" stroke="#7ee7c7" stroke-width="7" stroke-linecap="round" clip-path="url(#active)"/>
    <path d="M280 40V262" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
    <circle cx="280" cy="136" r="10" fill="#0f172a" stroke="#7ee7c7" stroke-width="5"/>
    <rect x="296" y="34" width="96" height="40" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="310" y="47" width="40" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="310" y="59" width="64" height="6" rx="3" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#7ee7c7" font-size="26" font-weight="600" letter-spacing="4">AGENT SKILLS</text>
    <text x="80" y="222" fill="#ffffff" font-size="72" font-weight="700">Swift Charts</text>
    <text x="80" y="282" fill="#cbd5e1" font-size="28">Selection-driven highlights from masks</text>
    <text x="80" y="322" fill="#cbd5e1" font-size="28">and layered copies — measured, not assumed.</text>
    <g font-size="22" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="362" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="155" y="391" text-anchor="middle">Measured</text>
      <rect x="244" y="362" width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="329" y="391" text-anchor="middle">SDK-checked</text>
      <rect x="428" y="362" width="196" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="526" y="391" text-anchor="middle">Approval-gated</text>
    </g>
  </g>
</svg>
