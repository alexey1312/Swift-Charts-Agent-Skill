name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show the toolchain
        run: xcodebuild -version
      - name: Show the Swift Charts SDK checks
        run: |
          python3 skills/swift-charts-dynamic-masking/scripts/charts_sdk_check.py --platform iphonesimulator
          python3 skills/swift-charts-hexagonal-heatmap/scripts/heatmap_sdk_check.py --platform iphonesimulator
      - name: Compile Python
        run: python3 -m compileall -q scripts skills tests
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Typecheck every reference sample at its iOS floor
        run: python3 scripts/typecheck_samples.py
      - name: Validate metadata
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .cursor-plugin/plugin.json >/dev/null
          python3 -m json.tool package.json >/dev/null
